# Configuración del servicio web de PORRA 26 en Railway.
# Railway lee este fichero automáticamente al detectarlo en la raíz del repo.
# El builder Railpack instala dependencias desde requirements.txt y respeta
# runtime.txt (NIXPACKS quedó deprecated; Railway lo rechaza ya).

[build]
builder = "RAILPACK"

[deploy]
# startCommand es autoritativo y sobreescribe lo que Railpack auto-detecte
# (Railpack detecta Django y genera un `gunicorn porra26.wsgi:application ...`
# por su cuenta, ignorando incluso el `web:` del Procfile).
# bin/start-web.sh ejecuta collectstatic ANTES de arrancar gunicorn, así los
# estáticos quedan en el FS del contenedor que sirve el tráfico. El Procfile
# se mantiene como documentación pero no es el que manda.
startCommand = "bash bin/start-web.sh"

# preDeployCommand corre DESPUÉS del build, en un contenedor con acceso a la
# red privada del proyecto (incluido Postgres) y a las variables del servicio.
# El `release:` del Procfile no sirve aquí porque se ejecuta en build-time sin
# red privada y peta al intentar conectar con Postgres.
# Solo dejamos migrate aquí: collectstatic se ejecuta en el startCommand
# porque el contenedor de preDeploy es efímero y los ficheros estáticos no
# se persisten al contenedor del runtime.
# El prefijo DJANGO_SETTINGS_MODULE protege frente a entornos donde la
# variable no se inyecte aún en este contenedor (lo hemos visto en shells del
# dashboard); `wsgi.py` lo fija para gunicorn, pero `manage.py` no.
preDeployCommand = "DJANGO_SETTINGS_MODULE=porra26.settings.prod python manage.py migrate --no-input"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
healthcheckPath = "/healthz/"
healthcheckTimeout = 30
