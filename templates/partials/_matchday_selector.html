{% if matchdays %}
<nav class="glass" style="display:flex;gap:6px;padding:8px;border-radius:14px" aria-label="Jornadas">
  {% for s in matchday_state %}
  <a href="?round={{ active_round }}&matchday={{ s.matchday }}"
     class="chip {% if s.active %}chip-open{% endif %}"
     style="text-decoration:none;{% if not s.open %}opacity:.55{% endif %}"
     {% if not s.open %}aria-disabled="true" title="Jornada bloqueada"{% endif %}>
    {% if not s.open %}🔒 {% endif %}<span class="label-full">Jornada {{ s.matchday }}</span><span class="label-short" aria-hidden="true">J{{ s.matchday }}</span>
  </a>
  {% endfor %}
</nav>
{% endif %}
