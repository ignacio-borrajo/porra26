<section class="glass pop" style="width:min(520px,100%);padding:28px;border-radius:24px;background:var(--surface-solid)">
  <header style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px">
    <div>
      <div class="eyebrow">RESULTADO OFICIAL · {{ pending_count }} pendiente{{ pending_count|pluralize }}</div>
      <h1 class="display" style="font-size:24px;margin:4px 0 0">Marcar resultado final</h1>
    </div>
    <button type="button" data-modal-close class="btn btn-ghost" style="width:36px;height:36px;padding:0;border-radius:12px" aria-label="Cerrar">{% load icons %}{% icon "x" width=14 %}</button>
  </header>
  <form method="post" action="{% url 'competicion:official' match.id %}">
    {% csrf_token %}
    <input type="hidden" name="action" value="">
    <div class="score-grid">
      <div class="score-grid__team score-grid__team--home">
        <div class="score-grid__team-head">
          <span class="score-grid__flag">{{ match.home.flag }}</span>
          <strong class="score-grid__name">{{ match.home.name }}</strong>
        </div>
        <div class="score-grid__stepper">
          <button type="button" class="btn btn-ghost" data-step="-1" aria-label="Restar gol {{ match.home.name }}">−</button>
          <input name="home" type="text" inputmode="numeric" data-max="20" value="{{ default_home }}" class="input" readonly>
          <button type="button" class="btn btn-ghost" data-step="1" aria-label="Sumar gol {{ match.home.name }}">+</button>
        </div>
      </div>
      <div class="display score-grid__divider">:</div>
      <div class="score-grid__team score-grid__team--away">
        <div class="score-grid__team-head">
          <span class="score-grid__flag">{{ match.away.flag }}</span>
          <strong class="score-grid__name">{{ match.away.name }}</strong>
        </div>
        <div class="score-grid__stepper">
          <button type="button" class="btn btn-ghost" data-step="-1" aria-label="Restar gol {{ match.away.name }}">−</button>
          <input name="away" type="text" inputmode="numeric" data-max="20" value="{{ default_away }}" class="input" readonly>
          <button type="button" class="btn btn-ghost" data-step="1" aria-label="Sumar gol {{ match.away.name }}">+</button>
        </div>
      </div>
    </div>
    <div style="display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap">
      <div>
        {% if match.has_result %}
        <button class="btn btn-ghost" type="submit"
                style="color:var(--c-red);border-color:oklch(from var(--c-red) l c h / 0.45)"
                onclick="if (!confirm('¿Borrar el resultado de {{ match.home.name }} {{ match.result_home }}–{{ match.result_away }} {{ match.away.name }}? Se descongelarán los puntos y se reiniciarán los aciertos de los jugadores. Los envíos a Teams que ya se hayan hecho se conservan.')) return false; this.form.querySelector('input[name=action]').value='delete';">
          Borrar resultado
        </button>
        {% endif %}
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-ghost" type="button" data-modal-close>Cancelar</button>
        {% if has_next %}
        <button class="btn btn-ghost" type="submit">Guardar resultado</button>
        <button class="btn btn-primary" type="submit" name="chain" value="1">Guardar y siguiente</button>
        {% else %}
        <button class="btn btn-primary" type="submit">Guardar resultado</button>
        {% endif %}
      </div>
    </div>
  </form>
</section>
