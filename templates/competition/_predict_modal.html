<section class="glass pop" style="width:min(520px,100%);padding:28px;border-radius:24px;background:var(--surface-solid)">
  <div class="eyebrow">PRONÓSTICO · {{ pending_count }} pendiente{{ pending_count|pluralize }}</div>
  <h1 class="display" style="font-size:24px">¿Cómo va a quedar?</h1>
  <form method="post" action="{% url 'competicion:predict' match.id %}">
    {% csrf_token %}
    <div class="score-grid">
      <div class="score-grid__team score-grid__team--home">
        <div class="score-grid__team-head">
          <span class="score-grid__flag">{{ match.home.flag }}</span>
          <strong class="score-grid__name">{{ match.home.name }}</strong>
        </div>
        <div class="score-grid__stepper">
          <button type="button" class="btn btn-ghost" data-step="-1" aria-label="Restar gol {{ match.home.name }}">−</button>
          <input name="home" type="text" inputmode="numeric" data-max="20" value="{{ pred.home|default:0 }}" class="input" readonly>
          <button type="button" class="btn btn-ghost" data-step="1" aria-label="Sumar gol {{ match.home.name }}">+</button>
        </div>
      </div>
      <div class="display score-grid__divider">:</div>
      <div class="score-grid__team score-grid__team--away">
        <div class="score-grid__team-head">
          <span class="score-grid__flag">{{ match.away.flag }}</span>
          <strong class="score-grid__name">{{ match.away.name }}</strong>
        </div>
        <div class="score-grid__stepper">
          <button type="button" class="btn btn-ghost" data-step="-1" aria-label="Restar gol {{ match.away.name }}">−</button>
          <input name="away" type="text" inputmode="numeric" data-max="20" value="{{ pred.away|default:0 }}" class="input" readonly>
          <button type="button" class="btn btn-ghost" data-step="1" aria-label="Sumar gol {{ match.away.name }}">+</button>
        </div>
      </div>
    </div>
    <div style="display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap">
      <button class="btn btn-ghost" type="button" data-modal-close>Cancelar</button>
      {% if has_next %}
      <button class="btn btn-ghost" type="submit">Guardar pronóstico</button>
      <button class="btn btn-primary" type="submit" name="chain" value="1">Guardar y siguiente</button>
      {% else %}
      <button class="btn btn-primary" type="submit">Guardar pronóstico</button>
      {% endif %}
    </div>
  </form>
</section>
