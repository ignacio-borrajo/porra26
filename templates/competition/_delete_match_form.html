{% comment %}
Botón de borrado de un partido para el gestor. Espera `m` en contexto y, opcionalmente,
`active_round`/`active_matchday` para volver a la misma vista tras borrar.
{% endcomment %}
<form method="post" action="{% url 'competicion:delete_match' m.id %}" style="margin:0"
      onsubmit="return confirm('¿Borrar definitivamente este partido? Se eliminarán también los pronósticos y datos asociados. Esta acción no se puede deshacer.');">
  {% csrf_token %}
  <input type="hidden" name="confirm_delete" value="1">
  {% if active_round %}<input type="hidden" name="round" value="{{ active_round }}">{% endif %}
  {% if active_matchday %}<input type="hidden" name="matchday" value="{{ active_matchday }}">{% endif %}
  <button type="submit" class="btn btn-ghost" style="padding:6px 12px;font-size:12px;color:#dc2626" title="Borrar partido">🗑 Borrar</button>
</form>
