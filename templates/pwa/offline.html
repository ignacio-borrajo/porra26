<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a1530">
  <title>Actualizando · La Porra del Jefe</title>
  <style>
    /* La página /offline/ se sirve desde el SW cuando el servidor está caído
       (típicamente durante un redeploy). Por eso TODO va inline: ni CSS
       externo ni imágenes con URL — si la red falla, esto sigue rindiendo. */
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #f1ecff;
      background:
        radial-gradient(1100px 600px at 20% 10%, #2a1d4a 0%, transparent 60%),
        radial-gradient(900px 500px at 80% 90%, #1a2a4a 0%, transparent 55%),
        #1a1530;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: env(safe-area-inset-top, 0) 24px env(safe-area-inset-bottom, 0);
    }
    .card {
      max-width: 420px;
      width: 100%;
      text-align: center;
      padding: 32px 24px;
    }
    .logo {
      width: 72px; height: 72px;
      margin: 0 auto 20px;
      display: grid; place-items: center;
      border-radius: 22px;
      background: linear-gradient(135deg, #6d8cff, #59d6ff);
      box-shadow: 0 18px 44px -16px #6d8cff, 0 0 0 1px rgba(255,255,255,0.16) inset;
      font-weight: 800; font-size: 28px;
      color: #0c0a1c;
      letter-spacing: -1px;
    }
    h1 { font-size: 22px; margin: 0 0 8px; font-weight: 700; letter-spacing: -0.2px; }
    p { margin: 0; color: #c9c1e6; line-height: 1.5; }
    .status {
      margin-top: 22px;
      display: inline-flex; align-items: center; gap: 10px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      font-size: 13px; color: #d8d2f0;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #59d6ff;
      box-shadow: 0 0 0 0 #59d6ff;
      animation: pulse 1.6s ease-out infinite;
    }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(89,214,255,0.55); }
      70%  { box-shadow: 0 0 0 14px rgba(89,214,255,0); }
      100% { box-shadow: 0 0 0 0 rgba(89,214,255,0); }
    }
    .hint { margin-top: 28px; font-size: 12px; color: #8e88aa; }
    @media (prefers-reduced-motion: reduce) {
      .dot { animation: none; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo" aria-hidden="true">P</div>
    <h1>Estamos actualizando</h1>
    <p>La app vuelve en unos segundos. No hace falta hacer nada: reintentamos automáticamente.</p>
    <div class="status"><span class="dot"></span><span id="status-text">Reintentando…</span></div>
    <p class="hint">Si la espera se alarga, intenta cerrar y abrir la app.</p>
  </main>
  <script>
    // Hacemos un fetch ligero al origen para detectar cuándo vuelve. Cuando
    // el origen responda con algo < 500, recargamos la página: la navegación
    // pasará por el service worker, que esta vez encontrará el server vivo y
    // servirá el HTML real.
    (function () {
      var statusEl = document.getElementById('status-text');
      var attempts = 0;
      var maxDelay = 15000;

      function delay() {
        // 3s base con backoff suave (3 → 5 → 7 → 9 → 12 → 15), tope 15s.
        return Math.min(3000 + attempts * 2000, maxDelay);
      }

      function ping() {
        attempts++;
        statusEl.textContent = 'Reintentando…';
        // `cache: 'no-store'` evita que Safari/Chrome devuelvan respuesta
        // cacheada del origen anterior. `redirect: 'manual'` evita seguir
        // un 301/302 que algunos proxies sirven durante el arranque.
        fetch(location.href, { cache: 'no-store', redirect: 'manual' })
          .then(function (res) {
            // Status 0 = opaqueredirect (manual redirect interceptado),
            // se trata como "no listo todavía".
            if (res.status >= 200 && res.status < 500) {
              statusEl.textContent = '¡Listo! Recargando…';
              setTimeout(function () { location.reload(); }, 200);
              return;
            }
            schedule();
          })
          .catch(function () { schedule(); });
      }

      function schedule() {
        var ms = delay();
        statusEl.textContent = 'Reintentando en ' + Math.round(ms / 1000) + 's…';
        setTimeout(ping, ms);
      }

      // Primer intento inmediato (puede que el server ya esté vivo y solo
      // tengamos un SW cacheado pendiente de descartar la página antigua).
      setTimeout(ping, 500);

      // El evento `online` indica que el navegador cree tener red de nuevo:
      // aprovechamos para forzar un intento sin esperar al timer.
      window.addEventListener('online', function () { ping(); });
    })();
  </script>
</body>
</html>
